name: Dev CI
# A push starts a run, so its result shows on the commit; runs started by hand
# (workflow_dispatch) don't show there. Until test-ci has dispatch: service (Phase B2),
# set TEST_CI_DISPATCH to manual and give each run a runner with test-ci-app's
# tools/app-dispatch.py. Then call test-ci's github_app branch (dev) or v1.
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dev:
    uses: i-aye-eye/test-ci/.github/workflows/gh200.yml@v1
    with:
      profile: dev-cpu
      script: ci/dev.sh
      args: ${{ vars.TEST_CI_SLEEP || '0' }}
      dispatch: ${{ vars.TEST_CI_DISPATCH || 'service' }}
