name: Dev CI
# By hand only, until test-ci has dispatch: service (Phase B2). Then add push, and
# call test-ci's github_app branch (dev) or v1.
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  dev:
    uses: i-aye-eye/test-ci/.github/workflows/gh200.yml@v0
    with:
      profile: dev-cpu
      script: ci/dev.sh
      args: ${{ vars.TEST_CI_SLEEP || '0' }}
      dispatch: ${{ vars.TEST_CI_DISPATCH || 'service' }}
    secrets:
      # No runner-admin-pat: the App makes runner configs
      origin-token: ${{ secrets.BRICS_CI_ORIGIN_TOKEN }}
